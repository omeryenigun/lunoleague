<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İletişim — Onyapp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body data-title="navContact">
<header>
  <nav class="nav">
    <a href="/" class="logo"><span class="logo-mark" aria-hidden="true">🎮</span><span><b>Onyapp</b></span></a>
    <div class="nav-end">
      <div class="menu">
        <a href="/" data-i18n="navHome">Ana Sayfa</a>
        <a href="/oyunlar" data-i18n="navGames">Oyunlar</a>
        <a href="/hakkimizda" data-i18n="navAbout">Hakkımızda</a>
        <a href="/iletisim" class="active" data-i18n="navContact">İletişim</a>
      </div>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="tr">TR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button class="nav-toggle" type="button" aria-label="Menü">☰</button>
    </div>
  </nav>
</header>
<main>
  <section class="page-head">
    <h1 data-i18n="contactTitle">İletişim</h1>
  </section>
  <section class="section">
    <div class="contact-wrap">
      <form class="contact-form">
        <div class="field">
          <label for="name" data-i18n="formName">Ad soyad</label>
          <input id="name" name="name" type="text" required>
        </div>
        <div class="field">
          <label for="email" data-i18n="formEmail">E-posta</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="field">
          <label for="subject" data-i18n="formSubject">Konu</label>
          <select id="subject" name="subject" required>
            <option value="" data-i18n="subjectPick">Seçiniz</option>
            <option data-i18n="subjectGeneral">Genel soru</option>
            <option data-i18n="subjectBug">Hata bildirimi</option>
            <option data-i18n="subjectWork">İş birliği</option>
            <option data-i18n="subjectIdea">Öneri</option>
          </select>
        </div>
        <div class="field">
          <label for="message" data-i18n="formMessage">Mesaj</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button type="submit" data-i18n="formSend">Gönder</button>
      </form>
    </div>
  </section>
</main>
<footer>
  <div class="footer-inner">
    <a href="/" class="logo"><span class="logo-mark" aria-hidden="true">🎮</span><span><b>Onyapp</b></span></a>
    <div class="footer-links">
      <a href="/" data-i18n="navHome">Ana Sayfa</a>
      <a href="/oyunlar" data-i18n="navGames">Oyunlar</a>
      <a href="/hakkimizda" data-i18n="navAbout">Hakkımızda</a>
      <a href="/iletisim" data-i18n="navContact">İletişim</a>
      <a href="https://onyapp.app/privacy" data-i18n="privacy">Gizlilik</a>
    </div>
    <div>© 2026 Onyapp</div>
  </div>
</footer>
<script src="js/i18n.js?v=7"></script>
<script src="js/main.js?v=7"></script>
</body>
</html>
